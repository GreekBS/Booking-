# Talos async worker — Railway Config-as-Code
#
# REQUIRED Railway service settings:
#   Root Directory = /  (repository root — do NOT set to apps/worker)
#   So pnpm-lock.yaml + workspaces resolve correctly.
#
# This file may be selected as the service config path, or the build/start
# commands below may be pasted into Service Settings.

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm run worker:railway:build"

[deploy]
startCommand = "pnpm run worker:railway:start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Minimal HTTP /healthz (see apps/worker health server). Railway injects PORT.
healthcheckPath = "/healthz"
healthcheckTimeout = 30
